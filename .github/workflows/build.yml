name: Build FFmpeg (Win64) with SVT-AV1-PSY + Opus

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PREFIX: ${{ github.workspace }}/build/prefix
      SRC: ${{ github.workspace }}/build/src
      DIST: ${{ github.workspace }}/dist
      PKG: ffmpeg-svtav1-psy-win64
      # Every source is pinned to an immutable tag so a rebuild reproduces the
      # same binary. Bump these deliberately; never track a moving branch.
      SVTAV1PSY_REPO: https://github.com/5fish/SVT-AV1.git
      SVTAV1PSY_REF: v2.3.260719
      FFMPEG_REF: n9.0.1
      OPUS_VERSION: "1.6.1"
      OPUS_SHA256: 6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1
      VMAF_VERSION: "3.2.0"
      DAV1D_VERSION: "1.5.4"

    steps:
      - name: Checkout (this repo, for the toolchain files)
        uses: actions/checkout@v7

      - name: Install cross toolchain & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 cmake nasm yasm meson ninja-build pkg-config \
            git make autoconf automake libtool zip ca-certificates

      - name: Install wine (to smoke-test the Windows binaries)
        run: |
          # "wine64" ships only /usr/lib/wine/wine64; the wrapper on PATH comes
          # from "wine". Ask for both, but tolerate the wrapper being missing.
          sudo apt-get install -y --no-install-recommends wine64 wine \
            || sudo apt-get install -y --no-install-recommends wine64

      - name: Prepare dirs
        run: mkdir -p "$PREFIX/lib/pkgconfig" "$SRC" "$DIST"

      # Dependencies change only when their pinned version changes, so cache the
      # whole install prefix and rebuild just FFmpeg on most runs. Restore and
      # save are split so a later failure (FFmpeg, verification) does not throw
      # away dependencies that built fine -- plain actions/cache only saves when
      # the whole job succeeds.
      - name: Restore dependency prefix
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: build/prefix
          key: deps-ubuntu24-svt${{ env.SVTAV1PSY_REF }}-opus${{ env.OPUS_VERSION }}-vmaf${{ env.VMAF_VERSION }}-dav1d${{ env.DAV1D_VERSION }}-v1

      # ---------------------------------------------------------------
      # 1) SVT-AV1-PSY  (static libSvtAv1Enc.a)
      # ---------------------------------------------------------------
      - name: Build SVT-AV1-PSY
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd "$SRC"
          git clone --depth 1 -b "$SVTAV1PSY_REF" "$SVTAV1PSY_REPO" svt-av1-psy
          cd svt-av1-psy
          git rev-parse HEAD > "$PREFIX/.svt-commit"
          mkdir build_win && cd build_win
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/toolchain/mingw-w64-x86_64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -G Ninja
          ninja -j$(nproc)
          ninja install
          # SVT uses C++ internally -> tell pkg-config so static FFmpeg links cleanly
          sed -i 's|^Libs.private:.*|Libs.private: -lstdc++ -lpthread|' "$PREFIX/lib/pkgconfig/SvtAv1Enc.pc"

      # ---------------------------------------------------------------
      # 2) libopus  (static)
      # ---------------------------------------------------------------
      - name: Build libopus
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd "$SRC"
          curl -fsSL "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz" -o opus.tar.gz
          echo "${OPUS_SHA256}  opus.tar.gz" | sha256sum -c -
          tar xf opus.tar.gz
          cd "opus-${OPUS_VERSION}"
          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$PREFIX" \
            --enable-static --disable-shared \
            --disable-doc --disable-extra-programs
          make -j$(nproc)
          make install

      # ---------------------------------------------------------------
      # 3) libvmaf  (static) -- for VMAF scoring
      # ---------------------------------------------------------------
      - name: Build libvmaf
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd "$SRC"
          git clone --depth 1 -b "v${VMAF_VERSION}" https://github.com/Netflix/vmaf.git vmaf
          cd vmaf/libvmaf
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/toolchain/meson-cross-mingw64.ini" \
            --prefix "$PREFIX" \
            --libdir lib \
            --buildtype release \
            --default-library static \
            -Denable_tests=false \
            -Denable_docs=false \
            -Dbuilt_in_models=true
          ninja -C build -j$(nproc)
          ninja -C build install
          test -f "$PREFIX/lib/pkgconfig/libvmaf.pc"

      # ---------------------------------------------------------------
      # 4) libdav1d  (static) -- fast AV1 decoding
      # ---------------------------------------------------------------
      - name: Build libdav1d
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cd "$SRC"
          git clone --depth 1 -b "$DAV1D_VERSION" https://code.videolan.org/videolan/dav1d.git dav1d
          cd dav1d
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/toolchain/meson-cross-mingw64.ini" \
            --prefix "$PREFIX" \
            --libdir lib \
            --buildtype release \
            --default-library static \
            -Denable_tools=false \
            -Denable_tests=false
          ninja -C build -j$(nproc)
          ninja -C build install
          test -f "$PREFIX/lib/pkgconfig/dav1d.pc"

      - name: Save dependency prefix
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/prefix
          key: deps-ubuntu24-svt${{ env.SVTAV1PSY_REF }}-opus${{ env.OPUS_VERSION }}-vmaf${{ env.VMAF_VERSION }}-dav1d${{ env.DAV1D_VERSION }}-v1

      # ---------------------------------------------------------------
      # 5) FFmpeg  (static ffmpeg.exe + ffprobe.exe)
      # ---------------------------------------------------------------
      - name: Build FFmpeg
        run: |
          cd "$SRC"
          git clone --depth 1 -b "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          ./configure \
            --prefix="$DIST/$PKG" \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --pkg-config=pkg-config \
            --pkg-config-flags=--static \
            --enable-gpl --enable-version3 \
            --enable-static --disable-shared \
            --enable-libsvtav1 \
            --enable-libopus \
            --enable-libvmaf \
            --enable-libdav1d \
            --extra-cflags="-I$PREFIX/include" \
            --extra-ldflags="-L$PREFIX/lib -static -static-libgcc -static-libstdc++" \
            --extra-libs="-lstdc++ -lpthread" \
            --disable-debug --disable-doc
          # sanity: all must be enabled or fail the build now
          grep -q "CONFIG_LIBSVTAV1_ENCODER 1" config_components.h
          grep -q "CONFIG_LIBOPUS_ENCODER 1" config_components.h
          grep -q "CONFIG_LIBVMAF_FILTER 1" config_components.h
          grep -q "CONFIG_LIBDAV1D_DECODER 1" config_components.h
          make -j$(nproc)
          make install

      - name: Verify (static linkage)
        run: |
          BIN="$DIST/$PKG/bin"
          for exe in ffmpeg.exe ffprobe.exe; do
            echo "=== $exe imports ==="
            x86_64-w64-mingw32-objdump -p "$BIN/$exe" | grep "DLL Name" | sort -u
            # Anything we compiled ourselves, or a runtime that is not on stock
            # Windows, must be inside the binary -- not an import.
            if x86_64-w64-mingw32-objdump -p "$BIN/$exe" | grep "DLL Name" \
                 | grep -iE "svt|opus|vmaf|dav1d|libgcc|libstdc|winpthread|libssp"; then
              echo "::error::$exe is not fully static"
              exit 1
            fi
          done

      - name: Verify (run the binaries under wine)
        env:
          WINEDEBUG: "-all"
          WINEARCH: win64
          # Must live under a directory the runner user owns; wine refuses to
          # create a prefix beneath root-owned /tmp.
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          # Depending on which wine package resolved, the loader is called
          # wine, wine-stable or wine64 -- and may not be on PATH at all.
          WINE=""
          for cand in wine wine-stable wine64 /usr/lib/wine/wine64; do
            if command -v "$cand" >/dev/null 2>&1; then WINE="$cand"; break; fi
          done
          if [ -z "$WINE" ]; then
            echo "::error::no wine loader found, cannot smoke-test the binaries"
            exit 1
          fi
          echo "using wine loader: $WINE"
          BIN="$DIST/$PKG/bin"
          FFMPEG="$WINE $BIN/ffmpeg.exe"
          FFPROBE="$WINE $BIN/ffprobe.exe"
          # Not suppressed: if the prefix cannot be set up, the reason should be
          # in the log rather than surfacing later as an unrelated failure.
          "$WINE" wineboot -i || true
          # Work in the temp dir so file arguments stay relative and wine does
          # not have to translate unix paths.
          cd "$RUNNER_TEMP"

          $FFMPEG -hide_banner -encoders | grep -q libsvtav1
          $FFMPEG -hide_banner -encoders | grep -q libopus
          $FFMPEG -hide_banner -decoders | grep -q libdav1d
          $FFMPEG -hide_banner -filters  | grep -q libvmaf

          SRC_LAVFI="testsrc2=size=320x240:rate=30:duration=2"
          echo "=== encode: SVT-AV1-PSY video + Opus audio ==="
          # Not piped into tee: that would mask ffmpeg's exit status.
          $FFMPEG -hide_banner -y \
            -f lavfi -i "$SRC_LAVFI" \
            -f lavfi -i "sine=frequency=440:duration=2" \
            -c:v libsvtav1 -preset 10 -crf 40 \
            -svtav1-params "lineart-psy-bias=3:texture-psy-bias=3" \
            -c:a libopus -b:a 96k smoke.mkv > encode.log 2>&1 || { cat encode.log; exit 1; }
          cat encode.log
          test -s smoke.mkv

          # FFmpeg downgrades unknown -svtav1-params to a warning and encodes on
          # regardless, so a stock SVT-AV1 would otherwise pass this test while
          # silently dropping every PSY setting. Assert on the encoder's own
          # banner and config instead of trusting the exit status.
          if grep -qi "parsing option" encode.log; then
            echo "::error::encoder rejected a -svtav1-params option"
            exit 1
          fi
          grep -q "SVT-AV1 \[5fish\]" encode.log
          grep -q "lineart PSY bias" encode.log
          grep -q "texture PSY bias" encode.log

          echo "=== decode back (libdav1d) ==="
          test "$($FFPROBE -v error -select_streams v:0 \
            -show_entries stream=codec_name -of csv=p=0 smoke.mkv | tr -d '\r')" = av1

          echo "=== VMAF scoring ==="
          $FFMPEG -hide_banner -i smoke.mkv -f lavfi -i "$SRC_LAVFI" \
            -lavfi "[0:v][1:v]libvmaf=n_threads=2" -f null - 2>&1 | tee vmaf.log
          grep -q "VMAF score" vmaf.log

      - name: Package
        id: package
        run: |
          OUT="$DIST/$PKG"
          SVT_COMMIT="$(cat "$PREFIX/.svt-commit")"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "svt_commit=$SVT_COMMIT" >> "$GITHUB_OUTPUT"

          cp README.md "$OUT/README.txt"
          cp "$SRC/ffmpeg/COPYING.GPLv3" "$OUT/COPYING.GPLv3.txt"
          cp "$SRC/ffmpeg/LICENSE.md" "$OUT/LICENSE.md"

          cat > "$OUT/BUILDINFO.txt" <<EOF
          ffmpeg-svtav1-psy-win64
          built ${STAMP} UTC from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} @ ${GITHUB_SHA}

          Components (all statically linked, all built from source in CI):
            FFmpeg         ${FFMPEG_REF}          https://github.com/FFmpeg/FFmpeg
            SVT-AV1-PSY    ${SVTAV1PSY_REF}       ${SVTAV1PSY_REPO}
                           commit ${SVT_COMMIT}
            libopus        ${OPUS_VERSION}        https://downloads.xiph.org/releases/opus/
            libvmaf        v${VMAF_VERSION}       https://github.com/Netflix/vmaf
            libdav1d       ${DAV1D_VERSION}       https://code.videolan.org/videolan/dav1d

          Toolchain: mingw-w64 GCC cross-compiler on ubuntu-24.04

          License: GPLv3 (configured with --enable-gpl --enable-version3).
          The complete corresponding source is the set of tags listed above; the
          exact build recipe is .github/workflows/build.yml in this repository.
          See COPYING.GPLv3.txt and LICENSE.md.
          EOF

          cd "$DIST"
          zip -r -9 "$PKG.zip" "$PKG"
          sha256sum "$PKG.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Immutable, dated release so an older build can always be recovered.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ steps.package.outputs.stamp }}
          name: FFmpeg ${{ env.FFMPEG_REF }} + SVT-AV1-PSY (${{ steps.package.outputs.stamp }})
          body_path: dist/${{ env.PKG }}/BUILDINFO.txt
          files: |
            dist/${{ env.PKG }}.zip
            dist/SHA256SUMS.txt

      # Rolling pointer that the README links to.
      - name: Update "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: FFmpeg Win64 + SVT-AV1-PSY + Opus (latest)
          body_path: dist/${{ env.PKG }}/BUILDINFO.txt
          files: |
            dist/${{ env.PKG }}.zip
            dist/SHA256SUMS.txt
